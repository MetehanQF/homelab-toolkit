# /etc/sysctl.d/99-swap-tuning.conf
#
# Neden: 2026-09-22 05:46 olcumu
#   SwapTotal 1048572 kB / SwapFree 51284 kB  -> %95 dolu
#   pswpout 207156 / pswpin 1608
#
# pswpout >> pswpin oldugu icin bu bir "thrashing" degil: sayfalar bir kez
# disari atilmis ve neredeyse hic geri cagrilmamis. PSI de bunu dogruluyor
# (memory some/full = 0.00). Yani performans su anda kotu degil.
#
# Sorun, swap'in TAMPON olarak tukenmis olmasi: 16 GiB RAM'li makinede
# sadece 1 GiB swap var ve o da dolu. Ani bir bellek talebinde geri
# cekilecek yer kalmiyor.
#
# En cok swap'te olan sureclerin hepsi Frigate alt surecleri (~100-124 MB).
# Bunlarin diskte beklemesi kamera olay isleme gecikmesine yansir.
#
# Varsayilan 60. Bu deger, RAM bol olsa bile cekirdegi anonim sayfalari
# page cache lehine disari atmaya tesvik ediyor. 16 GiB RAM + NVMe swap
# olan, gecikmeye duyarli servisler (Frigate, Home Assistant) calistiran
# bu makinede 10 daha dogru: swap hala acil durum tamponu olarak kalir,
# ama rutin olarak kullanilmaz.
vm.swappiness = 10
