# /etc/sysctl.d/99-wifi-usb-mem-stability.conf
#
# Neden: rtw88_usb (TP-Link Archer / RTL8822BU) TX yol birlestirmesi
# rtw_usb_tx_agg_skb() icinde 32 KB (order-3) BITISIK bellek blogunu
# GFP_ATOMIC ile ister. GFP_ATOMIC uyuyamaz ve geri kazanim (reclaim)
# yapamaz; sadece hazir serbest listelerden alabilir.
#
# 2026-09-21 18:22:47 kanit: "page allocation failure: order:3,
# GFP_ATOMIC ... rtw_usb_tx_agg_skb" -> hemen ardindan surekli
# "failed to get tx report from firmware". O anda Normal zone:
#   53200*4kB  8437*8kB  0*16kB  0*32kB  ...  = 16 KB ve uzeri SIFIR blok
# Ayrica /proc/vmstat: compact_stall 15 / compact_fail 15 / compact_success 0
# yani cekirdek birlestirmeyi 15 kez denedi, hicbirinde basaramadi.
#
# Asagidaki degerler yuksek-order atomik ayrimi buyutur ve kswapd'yi
# cok daha erken devreye sokar.

# Varsayilan 45056 (44 MB). Normal zone min watermark'i ~57 MB'tan
# ~340 MB'a cikarir; yuksek-order atomik rezerv bu degere gore olceklenir.
vm.min_free_kbytes = 262144

# Varsayilan 10 (mumkun olan en dar bant: min->low arasi sadece ~12 MB).
# 200 ile bant zone'un ~%2'sine cikar; kswapd bosluk daralmadan cok once
# geri kazanima baslar, atomik rezerv tukenmez.
vm.watermark_scale_factor = 200

# Varsayilan 20. Arka planda daha agresif bellek birlestirme.
vm.compaction_proactiveness = 40

# Kirli sayfa tavanini oranla degil BYTE ile sinirla. Varsayilan
# dirty_ratio=20 bu makinede ~3.2 GB kirli sayfa birikmesine izin
# veriyordu; NFS + WiFi gibi yavas bir yazma yolunda bu hem 8 GB'lik
# page cache sismesinin hem de parcalanmanin ana kaynagi.
# NOT: dirty_bytes ayarlanınca dirty_ratio otomatik 0 olur (beklenen).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
